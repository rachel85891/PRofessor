# yaml-language-server: $schema=schemas/review_rules.schema.json
# The course's review rules, for every assignment (ADR 0023, design §8.1). Format:
# assignments/README.md, "Review rules". An assignment's own rules are in its folder.
# Stage 3f moved these from the fixer's prompts (fixer_rules, fixer_examples and the
# self-review's "never a violation" list) and from services/fix_review.py and
# services/fix_edits.py; hw01's prompts must not change by one byte.
rules:
  - id: comments
    # Moved from code in stage 3f. Stage 18: `text` is the wording for every file type; a
    # prompt that edits only C# files shows the `//` wording of the approved PRs instead.
    applies_to: [fixer, judge]
    kind: style
    text: >-
      Write every comment you add in English, short, in the comment syntax of the file's
      type, with no space after the comment's start. Mark every code change with the fix
      marker line of the file's type directly above the changed code, saying what you
      changed and why. Every other comment is a question or an instruction for the student.
    wordings:
      - files: [.cs]
        text: >-
          Write every comment you add in English, short, right after `//` with no space.
          Mark every code change with a `//fix: ...` line directly above the changed code,
          saying what you changed and why (`//fix: Keep the id, otherwise the updated user
          is saved without it`). Every other comment is a question or an instruction for the
          student (`//Why isn't it implemented? It should read the file and return the user
          with this id (or NotFound / NoContent)`).
    forbidden_text:
      - pattern: '[\u0590-\u05FF]'
        message: added text must be English, never Hebrew
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 1"
    status: approved

  - id: safe-fixes
    # Moved from code in stage 3f. Which `using` lines: developer decision 2026-11-17.
    applies_to: [fixer, judge]
    kind: fix_allowed
    text: >-
      Fix only small, safe things: a missing `break` (a `switch` case that falls through, or
      a loop that keeps reading after it found its item), an id lost on update, `readonly`
      for a fixed path, a duplicate `using` line or a `using` of a namespace that does not
      exist (declared nowhere in the repo, and not from the framework or a referenced
      package), a controller class name without the `Controller` suffix (the route does not
      change), a broken data file (for example a missing final newline).
    detectors:
      - missing_break
      - id_assignment
      - readonly_field
      - stray_using
      - controller_suffix
      - final_newline
    never_a_violation: >-
      The small safe fixes of rule {rule:safe-fixes}: a missing `break`, an id lost on
      update restored with one assignment (for example `user.id = id;`), `readonly` for a
      fixed path, a removed duplicate `using` line or `using` of a namespace that does not
      exist, the `Controller` suffix added to a controller class name, a data file's missing
      final newline.
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 2"
    status: approved

  - id: no-core
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: never_do
    text: >-
      Never implement the core of the assignment (for example an unimplemented GET by id).
      Leave a question instead.
    approved_notes:
      - words: Why isn't it implemented
        what: the GET-by-id question in the approved wording
    never_a_violation: >-
      The GET-by-id question in the approved wording (`//Why isn't it implemented? It should
      read the file and return the user with this id (or NotFound / NoContent)`).
    clarification: >-
      Rule {rule:no-core} is about writing an action or logic the student did not write.
      Restoring a lost id with one assignment is rule {rule:safe-fixes}, not rule
      {rule:no-core}. A note that says what is expected is fine: the approved reviews do
      exactly that.
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 3"
    status: approved

  - id: naming
    # Moved from code in stage 3f. The stored-property note and its example: the HW04 round
    # read "use PropertyNameCaseInsensitive instead of renaming"; the option is what makes
    # a rename safe, not an alternative to it.
    applies_to: [fixer, judge]
    kind: note_only
    files: [.cs]
    note_section: names
    text: >-
      Naming (C# conventions) is in scope, as notes only: PascalCase types, properties and
      methods; camelCase locals; files named after their type; uncommon file names; unclear
      abbreviations. Never rename a stored model property yourself: System.Text.Json is
      case-sensitive, so the existing data file would stop loading. The note on a stored
      property says, in this order: the name to use (PascalCase); that the data file stores
      the current names; that if the student renames them, they set
      `PropertyNameCaseInsensitive = true` in the `JsonSerializerOptions`, so the existing
      file still loads. The option is what makes the rename safe, never an alternative to
      renaming: write the note in the wording of this rule's example.
    example:
      file: Models/Product.cs
      find: "    public string name { get; set; }"
      replace: "    //In C#, properties are written in PascalCase: Name. products.json stores the current names: if you rename them, set PropertyNameCaseInsensitive = true in the JsonSerializerOptions, so the existing file still loads\n    public string name { get; set; }"
    approved_notes:
      - words: PropertyNameCaseInsensitive
        what: a naming note with the PropertyNameCaseInsensitive tip
    never_a_violation: >-
      A naming note with the `PropertyNameCaseInsensitive` tip for a stored model property.
    origin:
      source: developer
      quote: >-
        docs/fix-pr-workflow.md §3, rule 7; the stored-property note and its example:
        developer decision 2026-11-19 (HW04 round review)
    status: approved

  - id: property-declarations
    # Stage 18: moved from services/fix_edits.py and the fixer_plan frame (stage 14). Shown
    # with the `fix` edit kind, not numbered, so the self-review's rule numbers stay.
    applies_to: [fixer]
    kind: never_do
    files: [.cs]
    shown_in: fix_kind
    text: Never change a property declaration (`{ get; set; }`).
    forbidden_change:
      - pattern: '\{\s*get;\s*(?:set|init);\s*\}'
        message: "a fix never changes a model's property declaration ({ get; set; })"
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 7 (never rename a stored model property)"
    status: approved

  - id: leftover-files
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: note_only
    text: >-
      Leftover or duplicate files go in `files_notes` (one short sentence each); never edit
      or delete them.
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 8"
    status: approved

  - id: repository-files
    # Stage 18: the stage 17 pilot run showed these findings never reached the PR. In a
    # prompt only when one of these requirements failed, so other prompts are unchanged.
    applies_to: [fixer, writer]
    kind: note_only
    when_found: [gen-gitignore, gen-no-build-output]
    # Reworded on 2026-11-19: the HW04 round copied the old fixed sentence word for word,
    # saying `bin/` and `obj/` (and "build output") for `.vs/` or `*.csproj.user`, and
    # "Add a `.gitignore`" when one existed.
    text: >-
      A failed repository requirement (no `.gitignore` that leaves out build and IDE files,
      or build or IDE files committed) becomes one item in `files_notes`, never an edit:
      one item for both findings, in the approved PRs' style. The item names the files and
      folders the findings list, and calls each what it is: `bin/` and `obj/` are build
      output, `.vs/` and `*.user` files are Visual Studio files; say that they should not
      be committed. Say "Add a `.gitignore` (in Visual Studio: Git > Settings, or `dotnet
      new gitignore`)" only when the `gen-gitignore` finding says the repository has no
      `.gitignore`; when it has one that misses entries, say which entries to add to it.
      End with how to remove the files from the repository.
    origin:
      source: developer
      quote: >-
        the approved PRs, one Files item (stage 17 pilot run, 2026-11-05); naming what was
        found: developer decision 2026-11-19 (HW04 round review)
    status: approved

  - id: student-level
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: style
    text: >-
      Second-year level: no refactoring, and no techniques that have not been
      taught{taught_so_far}.
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 9"
    status: approved

  - id: no-false-bugs
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: style
    text: >-
      Do not claim a bug that is not there. When unsure, ask a question in a note instead of
      changing code.
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 10"
    status: approved

  - id: assignment-wording
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: style
    text: >-
      Speak to the student about the assignment: write "The assignment asks…", never mention
      the lecturer.
    forbidden_text:
      - pattern: '\blecturer'
        ignore_case: true
        message: 'added text says "The assignment asks...", never mentions the lecturer'
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 11"
    status: approved

  - id: windows-paths
    # Stage 15: a path written with Windows folder separators is not held against the student.
    applies_to: [fixer, judge]
    kind: note_only
    text: >-
      A requirement not checked because the app could not open a path written with `\` as
      the folder separator (`windows_path`) is not the student's fault: never change that
      path. You may add one note right above the line that writes it, in the wording of
      this rule's example. This rule applies only when a requirement was not checked
      because of `windows_path`. Never use it for a full disk path (`D:\...`): that is the
      finding of `gen-no-absolute-paths`, with its own note.
    example:
      file: Data/Store.cs
      find: '    private readonly string path = "..\\data\\users.txt";'
      replace: "    //On Linux and macOS \"\\\\\" isn't a folder separator: Path.Combine(\"..\", \"data\", \"users.txt\") works everywhere\n    private readonly string path = \"..\\\\data\\\\users.txt\";"
    approved_notes:
      - words: isn't a folder separator
        what: the note about a path written with Windows folder separators
        # The 2026-11-14 round used it on full disk paths; developer decision 2026-11-16.
        only_when_not_evaluated: windows_path
    never_a_violation: >-
      The note of rule {rule:windows-paths} about a path written with `\` as the folder
      separator.
    origin:
      source: developer
      quote: "developer decision 2026-11-05"
    status: approved

  - id: notes-only-requirements
    # Stage 20: requirements with `feedback: notes_only` (architecture feedback). The code
    # rejects a fix for them; this rule tells the fixer before it plans. In a prompt only
    # when one of them failed ({notes_only}), so other prompts are unchanged.
    applies_to: [fixer]
    kind: note_only
    note_section: for_you
    text: >-
      Requirements {notes_only} allow notes only: for their findings, plan `note` edits (a
      question or an instruction for the student), never a `fix`. A `fix` that claims one of
      them, or that changes a file only their findings point to, is rejected.
    origin:
      source: developer
      quote: "approved implementation approach, docs/design.md §7 (developer, 2026-11-10)"
    status: approved

  - id: only-what-is-needed
    # The 2026-11-14 round's PRs had edits no finding asked for (a removed unused `using`,
    # a `break` where nothing was wrong, the id set on update with no finding about it).
    applies_to: [fixer, judge]
    kind: never_do
    text: >-
      A `fix` changes only what a finding or a real bug needs. A correct `using` that is
      only unused is never removed: add one note right above it instead, in this wording:
      `//This using isn't used in this file: you can remove it`. Never reformat code or
      "improve" code that works.
    example:
      file: Services/ProductService.cs
      find: "        existing.Price = product.Price;\n        existing.Price = product.Stock;"
      replace: "        existing.Price = product.Price;\n        //fix: Save the stock in Stock, not in Price, so updating keeps both\n        existing.Stock = product.Stock;"
    approved_notes:
      - words: isn't used in this file
        what: the note about an unused using
    never_a_violation: >-
      The note of rule {rule:only-what-is-needed} about a `using` that isn't used in this
      file.
    origin:
      source: developer
      quote: >-
        developer decision 2026-11-16 (full-round review); the `using` part: developer
        decision 2026-11-17
    status: approved

  - id: no-comment-pointers
    # The 2026-11-14 round's PRs said "A comment is there to guide you" in many items.
    applies_to: [writer]
    kind: style
    text: >-
      Never write "A comment is there to guide you", "A comment is there to explain this",
      "A comment asks..." or anything like it: the section's heading already says the code
      is marked. Say what to do or what was changed.
    forbidden_text:
      - pattern: '\b(?:a|the|this) comments? (?:is there|are there|asks?|explains?|guides?)\b'
        ignore_case: true
        message: >-
          never write "A comment is there to guide you" or "A comment asks..."; the
          section's heading already says the code is marked
    origin:
      source: developer
      quote: "developer decision 2026-11-16 (full-round review)"
    status: approved

  - id: naming-items
    # The 2026-11-14 round's PRs had naming items that said a name "is already correct".
    applies_to: [writer]
    kind: style
    text: >-
      A naming item never says a name "is correct" or "is already correct". It names the
      wrong name and the name to use (for example "`passwordCheck` should be
      `PasswordCheck`").
    origin:
      source: developer
      quote: "developer decision 2026-11-16 (full-round review)"
    status: approved

  - id: every-failing-requirement
    # The HW04 round left about 15 failing requirements with no question (PUT accepting a
    # weak password with 200, no password service or controller, 204 for a wrong login).
    # The code asks once more for the review's own failing requirements that no edit
    # claims (services/fixing.py, `uncovered`).
    applies_to: [fixer]
    kind: style
    text: >-
      Every failing requirement of {short_name} gets at least one question or note in the
      code (or a fix, where the rules allow one), on the line where the student should
      work, and that edit lists the requirement's id in `finding_ids`. When the code it
      needs does not exist yet (for example there is no password service), put the
      question where that code would be used, and ask where it is.
    origin:
      source: developer
      quote: "developer decision 2026-11-19 (HW04 round review)"
    status: approved

  - id: connection-string
    # A published HW03 PR asked where the connection string should be kept and pointed to
    # appsettings.json; the writer repeated it. Not taught yet: no `until`, the assignment
    # that teaches it `replaces` this rule.
    applies_to: [fixer, judge, writer]
    kind: never_mention
    text: >-
      Never ask or tell the student to move the connection string to `appsettings.json`,
      and never ask where it should be kept: a connection string written in the code is
      fine, it has not been taught yet.
    origin:
      source: developer
      quote: "developer decision 2026-11-19 (HW04 round review)"
    status: approved

examples:
  - id: break-and-naming
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    situation: >-
      `Controllers/ProductsController.cs` has a `switch` where `case 1:` falls through to
      `case 2:`, and a local named `Total_Price`. Requirement `hw09-update` (major) fails
      because updating changes the wrong field.
    plan: |-
      {"edits": [
        {"file": "Controllers/ProductsController.cs",
         "find": "                product.Price = value;\n            case 2:",
         "replace": "                product.Price = value;\n                //fix: Added the missing break, so changing the price no longer changes the stock too\n                break;\n            case 2:",
         "kind": "fix", "finding_ids": ["hw09-update"],
         "reason": "case 1 falls through to case 2 and overwrites the stock.",
         "fallback_note": "Does case 1 need a break? Right now it also runs case 2.",
         "note_section": null},
        {"file": "Controllers/ProductsController.cs",
         "find": "        double Total_Price = 0;",
         "replace": "        //In C#, local variables are written in camelCase: totalPrice.\n        double Total_Price = 0;",
         "kind": "note", "finding_ids": [],
         "reason": "Naming: locals are camelCase.", "fallback_note": null,
         "note_section": "names"}
       ],
       "files_notes": ["Class1.cs looks like a leftover from the project template; is it still needed?"]}
    origin:
      source: developer
      quote: "the approved PRs, as invented repos"
    status: approved
