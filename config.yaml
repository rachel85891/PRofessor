# Non-secret settings for HW Checker.
# Secrets live in .env (see .env.example).
# Any value can be overridden by an environment variable with the HW_CHECKER_ prefix,
# using "__" for nesting, for example HW_CHECKER_LOGGING__LEVEL=DEBUG.

# Directory for clones and run artifacts (relative to the working directory).
workspace_dir: workspace

# Directory holding one folder per assignment with its requirements.yaml (see its README.md).
assignments_dir: assignments

# Maximum number of repos checked in parallel (at least 1).
max_parallel_repos: 3

logging:
  # One of DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level: INFO
  # Directory for the JSON-lines log file.
  log_dir: logs

roster:
  # Sheet holding the roster; leave empty (null) to use the first sheet.
  sheet_name: Sheet1
  # Row number (1-based) of the header row; data starts on the row below.
  header_row: 1
  # Header text of each column, matched ignoring case and surrounding spaces.
  # The roster file itself is kept outside the repo (it holds students' names).
  columns:
    name: "שם + משפחה"
    partner_name: "בת הזוג של"
    github_url: Github Url

git:
  # Git executable; a full path if git is not on PATH.
  executable: git
  # Maximum seconds for one git command (clone included) before it is aborted.
  timeout_seconds: 120
  # TLS backend for HTTPS remotes (openssl, schannel, or null for the machine's git config).
  # schannel because on this Windows machine the OpenSSL backend hangs during the TLS
  # handshake with GitHub.
  ssl_backend: schannel
  # A clone or fetch that fails with a transient network error (the host cannot be resolved
  # or reached, a server error, an interrupted transfer) is retried this many times, this
  # many seconds apart. A missing repo or denied access is never retried.
  network_retries: 2
  retry_backoff_seconds: 3
  # The author of fix commits (commit_author_name, commit_author_email) is a personal
  # identity, so it is set in .env, not here. See .env.example.

github:
  # Publishing review pull requests (docs/fix-pr-workflow.md, ADR 0018). The account is the
  # dedicated review account, never a personal one; its token is HW_CHECKER_GITHUB_TOKEN in
  # .env (see .env.example).
  api_url: https://api.github.com
  web_url: https://github.com
  account: seeandbesharp-code-review
  # Each student repo gets one fork in the account, named <fork_prefix><student's username>,
  # created once and reused every round.
  fork_prefix: check_
  timeout_seconds: 30
  # How long to wait for a new fork to answer, checking every fork_poll_seconds.
  fork_wait_seconds: 60
  fork_poll_seconds: 2

runner:
  # Images pinned by digest, so a patch release never changes results mid-semester.
  # Update the digests at the start of each semester, and when a .NET security patch is
  # announced: docker pull <image>, then docker image inspect <image> --format "{{index .RepoDigests 0}}".
  # One SDK/runtime pair per supported target framework; a project on another framework is
  # flagged for review. Pinned 2026-10-25: SDK 8.0.426 / runtime 8.0.32, SDK 9.0.319 /
  # runtime 9.0.21, SDK 10.0.402 / runtime 10.0.13.
  framework_images:
    net8.0:
      sdk: mcr.microsoft.com/dotnet/sdk:8.0@sha256:738f72aff955d5c5690e06b6fc8ecd1b90ead564099a257ac528ff720b8da85f
      runtime: mcr.microsoft.com/dotnet/aspnet:8.0@sha256:74a1d7c07211a7e8a2e35ff3c70ed8e4e1d6451a1ff7cf7bdf526f9eafa23023
    net9.0:
      sdk: mcr.microsoft.com/dotnet/sdk:9.0@sha256:d9ad72f6b3eb5d61adb158db510ae1c3098c12c92d23ab8da833418275f1c652
      runtime: mcr.microsoft.com/dotnet/aspnet:9.0@sha256:88fcfc1b81c43afa15ba3c138c57d77f77c1cb5118ae9d7024c94e82e2895aa5
    net10.0:
      sdk: mcr.microsoft.com/dotnet/sdk:10.0@sha256:747cbade5bfd918a175ac32f8f1d931edec2c7d0d5397a3de72eaef1ac1f66d2
      runtime: mcr.microsoft.com/dotnet/aspnet:10.0@sha256:8af87eba5e7cdafb1514d7388be287365da97c132509e84dfe252ffd552398ca
  # The course's framework. A project on an older one still runs, and the student is asked
  # to move it (never a finding).
  course_framework: net10.0
  probe_image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
  # Resource limits per step (ADR 0015 measurements: publish peaks near 180 MB and 2 CPUs).
  restore_limits: {memory_mb: 1024, cpus: 2, pids: 512}
  build_limits: {memory_mb: 1024, cpus: 2, pids: 512}
  run_limits: {memory_mb: 512, cpus: 1, pids: 512}
  probe_limits: {memory_mb: 64, cpus: 0.5, pids: 64}
  # Timeouts in seconds. The slowest measured start was about 5 s.
  restore_timeout_seconds: 300
  build_timeout_seconds: 300
  readiness_timeout_seconds: 30
  # The first request to a freshly started app can take several seconds on a busy machine,
  # and a probe that times out counts as "no answer", so leave room.
  probe_timeout_seconds: 10
  readiness_poll_seconds: 0.5
  # The probe sidecar reaches the app by the network alias "app". If it cannot resolve that
  # name for longer than this, the run is an environment failure, not a slow start.
  resolve_grace_seconds: 5
  # Port the app listens on inside its container (ASPNETCORE_HTTP_PORTS).
  app_port: 8080
  # Non-root user of the official .NET images; owns the files copied into the container.
  app_uid: 1654
  app_gid: 1654
  # Shared NuGet package cache volume, kept across rounds.
  nuget_cache_volume: hw-checker-nuget-cache
  # Prefix of the labels on everything the runner creates, used by the leftover sweep.
  label_prefix: hw-checker
  # Largest working copy (all files) and largest single file copied into a container;
  # a larger repo is not run and is flagged for manual review.
  max_archive_mb: 200
  max_file_mb: 50
  # The most of each probe response (headers and body) read back; larger bodies are cut,
  # never failed.
  max_response_kb: 64
  # Seconds the Docker client waits for one engine API call.
  engine_timeout_seconds: 120
  # Folder for full build and run logs inside each run's folder:
  # <workspace_dir>/runs/<run_id>/<logs_root>/<repo_id>.
  logs_root: logs

storage:
  # SQLAlchemy database URL. SQLite now; PostgreSQL later by changing only this (ADR 0007).
  # A relative SQLite path is relative to the folder the program runs in.
  database_url: sqlite:///workspace/hw_checker.db

llm:
  # Where the roles' models run (ADR 0008); switching is this line only:
  #   openrouter: an OpenAI-compatible endpoint (ADR 0020), paid per token from the key's
  #               credit. Uses base_url, roles, temperature, max_output_tokens, extra_body
  #               and HW_CHECKER_LLM__API_KEY.
  #   copilot:    the developer's GitHub Copilot seat through the Copilot SDK (ADR 0022);
  #               every prompt counts toward the seat's premium requests. Uses copilot
  #               (below) and the Copilot CLI login (README, "The LLM provider").
  # timeout_seconds, max_retries, retry_backoff_seconds and max_prompt_chars apply to both.
  # copilot is the default here (2026-11-02); openrouter is the fallback, set it here or
  # with HW_CHECKER_LLM__PROVIDER=openrouter if the seat is unavailable.
  provider: copilot
  # --- openrouter only ---
  # Any OpenAI-compatible endpoint (ADR 0020): OpenAI or another by changing base_url, the
  # model ids and the key, never the code. The key is a secret: HW_CHECKER_LLM__API_KEY in
  # .env (see .env.example).
  base_url: https://openrouter.ai/api/v1
  # The model for each role, as the endpoint names it. Proposed 2026-10-31 from OpenRouter's
  # model list (both support structured outputs); the developer decides. Prices per million
  # tokens, input / output: claude-haiku-5.5 $0.10 / $0.50, claude-sonnet-5.5 $2 / $10.
  roles:
    reviewer: anthropic/claude-haiku-5.5
    writer: anthropic/claude-haiku-5.5
    judge: anthropic/claude-sonnet-5.5
    fixer: anthropic/claude-sonnet-5.5
  # null: not sent. These models do not accept temperature on OpenRouter, and with
  # require_parameters (below) any parameter a model does not support makes the request
  # unroutable (HTTP 404 "No endpoints found"). Set a number only for models that list
  # temperature in their supported parameters.
  temperature: null
  # The most tokens one reply may have, always sent. Without it OpenRouter reserves the
  # model's whole output limit against the key's credit (HTTP 402).
  max_output_tokens: 4096
  # Extra JSON fields sent with every request. OpenRouter's provider routing: never use a
  # provider that may train on the data (required on OpenRouter, ADR 0020), and only
  # providers that support every parameter sent (structured output). Remove this for an
  # endpoint that is not OpenRouter.
  extra_body:
    provider:
      data_collection: deny
      require_parameters: true
  # --- copilot only ---
  copilot:
    # The model for each role, as the seat's model list names it (the developer decides).
    # Read 2026-11-02 from the seat of the logged-in account: claude-haiku-5.5 and
    # claude-sonnet-5.5 are both offered and enabled. The SDK's model list gives no
    # premium-request multiplier; llm-check's log shows each call's premium requests.
    roles:
      reviewer: claude-haiku-5.5
      writer: claude-haiku-5.5
      judge: claude-sonnet-5.5
      fixer: claude-sonnet-5.5
    # Seconds to wait for the Copilot CLI to start and report its login.
    start_timeout_seconds: 60
  # --- both providers ---
  # Seconds to wait for one reply (for copilot, also for opening a session).
  timeout_seconds: 60
  # A role's own wait, instead of timeout_seconds. The fixer's plans took up to 28 s on the
  # pilot repos through Copilot (2026-11-04); 120 s leaves room for a larger repo.
  role_timeouts:
    fixer: 120
  # Retries after a rate limit, a timeout or a server error, waiting retry_backoff_seconds
  # before the first and doubling each time. Other errors are never retried.
  max_retries: 2
  retry_backoff_seconds: 2
  # A longer prompt is refused before it is sent (about 15,000 tokens).
  max_prompt_chars: 60000
  # Sending students' code to the LLM (the fixer) needs the lecturer's approval. Only the
  # developer sets this to true, once the lecturer has approved it.
  student_code_approved: false

fixer:
  # The fixer (stage 14, ADR 0021): one verified review branch and PR text per repo, waiting
  # at the approval gate. It sends each repo's code to the LLM, so it needs
  # llm.student_code_approved: true; startup stops otherwise.
  enabled: false
  # Let the judge role remove applied edits that break the review rules in spirit.
  self_review: true
  # Plans per repo; after the last one, failing fixes become their fallback notes.
  max_attempts: 2
  # Calls per LLM step when the model's reply cannot be parsed.
  reply_attempts: 2
  # At most this many edits per repo, and code lines per fix.
  max_edits: 12
  max_fix_lines: 6
  # A longer source file is cut to this many characters in the prompt.
  max_file_chars: 12000
  # What the model sees: code and project files, configuration (never edited), and the data
  # file (any file with a data suffix that is not configuration or ignored).
  source_suffixes: [.cs, .csproj]
  config_globs: ["appsettings*.json"]
  data_suffixes: [.txt, .json]
  ignored_globs: [launchSettings.json, "*.deps.json", "*.runtimeconfig.json", global.json]
  skip_dirs: [bin, obj, .git, .vs, .vscode, node_modules]
