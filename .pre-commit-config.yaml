# Install with: uv run pre-commit install
# Project tools run as local hooks through uv, so they use the versions pinned in uv.lock.
# Python tools run as `python -m <tool>`, which avoids depending on console-script .exe shims.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=no]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run python -m mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: detect-secrets
        name: detect-secrets
        entry: uv run python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline
        language: system
        exclude: ^uv\.lock$
