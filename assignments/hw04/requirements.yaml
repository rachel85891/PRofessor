# Approved on 2026-11-18 through the authoring graph (design §8.3); origins kept.
id: hw04
order: 4
title: Password strength validation in the client, registration and update
taught_techniques:
- controllers
- http endpoints
- text-file storage
- client pages with fetch
- layer projects
- dependency injection
lenient_notes:
- The strength check may be at any route the student's code declares
- The strength check may return a bare number or an object with a score field
- A score from 0 to 4 is valid
- Any 400 body for a weak password is accepted; an empty BadRequest() gets a note, not a failure
requirements:
- id: hw04-strength-score
  kind: http
  title: The password strength check returns the password's score
  description: POST with the password as a JSON string. The reply is a bare number or an object with a
    score field.
  severity: major
  allowed_alternatives:
  - The route may be any the student's code declares (the listed alternatives)
  - The body is the password as a JSON string
  - The reply may be a bare number or an object with a score field
  - A score from 0 to 4 is valid
  probes:
  - method: POST
    path: /api/password
    path_alternatives:
    - /api/passwords
    - /api/strongpassword
    - /api/pass
    - /api/password/strength
    - /api/password/check
    - /api/passwords/password
    - /api/users/checkpassword
    - /api/user/passwordstrength
    - /api/user/passwordcheck
    - /api/users/password
    # Developer decision 2026-11-18 (HW04 pilot): the route as the student's code spells it.
    - /passward/check_strengh
    expect_values:
    - '0'
    body: '"123456"'
    expected_status: 200
  - method: POST
    path: /api/password
    path_alternatives:
    - /api/passwords
    - /api/strongpassword
    - /api/pass
    - /api/password/strength
    - /api/password/check
    - /api/passwords/password
    - /api/users/checkpassword
    - /api/user/passwordstrength
    - /api/user/passwordcheck
    - /api/users/password
    - /passward/check_strengh
    expect_values:
    - '2'
    body: '"Probe9!"'
    expected_status: 200
  - method: POST
    path: /api/password
    path_alternatives:
    - /api/passwords
    - /api/strongpassword
    - /api/pass
    - /api/password/strength
    - /api/password/check
    - /api/passwords/password
    - /api/users/checkpassword
    - /api/user/passwordstrength
    - /api/user/passwordcheck
    - /api/users/password
    - /passward/check_strengh
    expect_values:
    - '3'
    body: '"Probe9!Alpha"'
    expected_status: 200
  origin:
    source: intake
    quote: 'The password strength check returns the password''s score: 0 for 123456, 2 for Probe9!, 3
      for Probe9!Alpha'
    item: requirements.return_values.1
  status: approved
- id: hw04-register-weak
  kind: http
  title: POST /api/users with a weak password (score below 3) returns 400
  severity: major
  allowed_alternatives:
  - Any 400 body is accepted; an empty BadRequest() gets a note, not a failure
  probes:
  - method: POST
    path: /api/users
    path_alternatives:
    - /api/user
    - /users
    - /user
    - /api/login
    - /api/users/register
    - /api/users/signup
    - /users/loguppost
    - /api/users/signin
    - /api/user/signin
    body: '{"userName|email|name":"weak1.user@example.com","password":"123456"}'
    expected_status: 400
  - method: POST
    path: /api/users
    path_alternatives:
    - /api/user
    - /users
    - /user
    - /api/login
    - /api/users/register
    - /api/users/signup
    - /users/loguppost
    - /api/users/signin
    - /api/user/signin
    body: '{"userName|email|name":"weak2.user@example.com","password":"Probe9!"}'
    expected_status: 400
  # Developer decision 2026-11-18 (HW04 pilot): a broken registration is reported once, by hw01-create.
  depends_on:
  - hw01-create
  origin:
    source: developer
    quote: edited by hand before approval
  status: approved
- id: hw04-register-strong
  kind: http
  title: POST /api/users with Probe9!Alpha (score 3) still creates the user
  severity: critical
  allowed_alternatives:
  - Returning 200 instead of 201 is acceptable
  probes:
  - method: POST
    path: /api/users
    path_alternatives:
    - /api/user
    - /users
    - /user
    - /api/login
    - /api/users/register
    - /api/users/signup
    - /users/loguppost
    - /api/users/signin
    - /api/user/signin
    body: '{"userName|email|name":"strong.user@example.com","password":"Probe9!Alpha"}'
    expected_status: 201
    allowed_statuses:
    - 201
    - 200
  depends_on:
  - hw01-create
  origin:
    source: developer
    quote: edited by hand before approval
  status: approved
- id: hw04-update-weak
  kind: http
  title: PUT /api/users/{id} with a weak password (score below 3) returns 400
  description: The user id comes from the registration probe of hw01-create.
  severity: major
  allowed_alternatives:
  - Any 400 body is accepted; an empty BadRequest() gets a note, not a failure
  probes:
  - method: POST
    path: /api/users
    path_alternatives:
    - /api/user
    - /users
    - /user
    - /api/login
    - /api/users/register
    - /api/users/signup
    - /users/loguppost
    - /api/users/signin
    - /api/user/signin
    capture:
      name: user_id
      from: body:id
    expect_json: object
    body: '{"userName|email|name":"update.weak@example.com","password":"Probe9!Alpha"}'
    expected_status: 201
    allowed_statuses:
    - 201
    - 200
    notes: Creates the user to update
  - method: PUT
    path: /api/users/{user_id}
    path_alternatives:
    - /api/user/{user_id}
    - /users/{user_id}
    - /user/{user_id}
    - /api/login/{user_id}
    body: '{"id":"{user_id}","userName|email|name":"update.weak@example.com","password":"123456"}'
    expected_status: 400
  - method: PUT
    path: /api/users/{user_id}
    path_alternatives:
    - /api/user/{user_id}
    - /users/{user_id}
    - /user/{user_id}
    - /api/login/{user_id}
    body: '{"id":"{user_id}","userName|email|name":"update.weak@example.com","password":"Probe9!"}'
    expected_status: 400
  depends_on:
  - hw01-create
  origin:
    source: developer
    quote: edited by hand before approval
  status: approved
