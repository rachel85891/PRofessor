- id: hw04-password-service-used
  kind: code
  title: The users controller and the password controller both take the password service's interface and
    call it
  severity: major
  feedback: notes_only
  reviewer_guidance: 'Both controllers must receive the password service through its interface in the
    constructor and call it. A finding: a controller that takes the class, creates it with new, or does
    its own strength check.'
  lenient_notes:
  - Do not judge the names of the interface or the controllers
  - Do not judge the route
  concerns:
    roles:
    - api
    - services
  origin:
    source: intake
    quote: Both the users controller and the password controller take the password service's interface
      in their constructor and call it
    item: requirements.architecture.1
  status: approved
- id: hw04-client-button
  kind: code
  title: The client page has a button that checks the password's strength and shows the score
  severity: major
  feedback: notes_only
  reviewer_guidance: 'A page under wwwroot has a button whose script sends the password to the strength
    check with fetch and shows the returned score on the page. A finding: no such button, or the score
    is not shown.'
  lenient_notes:
  - Do not judge the look of the page
  - Do not judge element names
  concerns:
    files:
    - '**/wwwroot/**/*.html'
    - '**/wwwroot/**/*.js'
  origin:
    source: developer
    quote: edited by hand before approval
  status: approved
