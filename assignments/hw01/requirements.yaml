# Assignment 1: users API with text-file storage.
# Approved by the developer on 2026-10-25 as a starting point; to be finalized with the lecturer.
# Updated by the developer on 2026-10-26 (lecturer input): DELETE not required, PUT required, wrong login returns 204, content checks added.
# Updated by the developer on 2026-10-28 (lecturer input): GET all not required, PUT returns Ok().
# Updated by the developer on 2026-10-29: update-then-read-back and login-returns-user added (from the manual review).
# Stage 14d: depends_on added (approved by the developer on 2026-11-05).
# Stage 15: ends_when added (developer decision 2026-11-05): the next task (layers) adds a second project.
# taught_techniques: to be filled from the course slides.
id: hw01
order: 1
title: Users API with text-file storage
ends_when:
  check: project_count
  params:
    min: 2
# Stage 18 (developer decision 2026-11-05, hw01 client task): the fixer also reviews the
# client files in wwwroot, at any depth, but never a library.
reviewed_files:
  include: ["**/wwwroot/**/*.html", "**/wwwroot/**/*.js", "**/wwwroot/**/*.css"]
  exclude: ["**/*.min.js", "**/*.min.css", "**/lib/**"]
requirements:
  - id: hw01-get-missing
    kind: http
    title: GET by id of a user that does not exist does not return 200
    severity: major
    allowed_alternatives:
      - Returning 204 NoContent is acceptable
    probes:
      - method: GET
        path: /api/users/99999
        path_alternatives: [/api/user/99999, /users/99999, /user/99999, /api/login/99999]
        expected_status: 404
        allowed_statuses: [404, 204]

  - id: hw01-create
    kind: http
    title: POST creates a user
    severity: critical
    allowed_alternatives:
      - Returning 200 instead of 201 is acceptable
    probes:
      - method: POST
        path: /api/users
        path_alternatives:
          - /api/user
          - /users
          - /user
          - /api/login
          - /api/users/register
          - /api/users/signup
          - /users/loguppost
          - /api/users/signin
          - /api/user/signin
        body:
          userName|email|name: probe.user@example.com
          password: "Probe9!Alpha"  # pragma: allowlist secret
        expected_status: 201
        allowed_statuses: [201, 200]
        expect_json: object
        capture:
          name: user_id
          from: body:id

  - id: hw01-read-back
    kind: http
    title: The created user can be read back by id (the data is saved)
    severity: critical
    depends_on: [hw01-create]  # reads the user the POST probe created
    probes:
      - method: GET
        path: "/api/users/{user_id}"
        path_alternatives: ["/api/user/{user_id}", "/users/{user_id}", "/user/{user_id}", "/api/login/{user_id}"]
        expected_status: 200
        expect_json: object
        expect_values: ["probe.user@example.com"]

  - id: hw01-login
    kind: http
    title: Login with correct details succeeds
    severity: major
    depends_on: [hw01-create]  # logs in as the user the POST probe created
    allowed_alternatives:
      - Returning 201 is acceptable
    probes:
      - method: POST
        path: /api/users/login
        path_alternatives:
          - /api/user/login
          - /users/login
          - /user/login
          - /api/login/login
          - /api/users/signin
          - /api/user/signin
          - /users/loginpost
        body:
          userName|email|name: probe.user@example.com
          password: "Probe9!Alpha"  # pragma: allowlist secret
        expected_status: 200
        allowed_statuses: [200, 201]

  - id: hw01-login-returns-user
    kind: http
    title: Login returns the stored user, including its id
    severity: minor
    depends_on: [hw01-create, hw01-login]  # the created user's id, from a login that succeeds
    probes:
      - method: POST
        path: /api/users/login
        path_alternatives:
          - /api/user/login
          - /users/login
          - /user/login
          - /api/login/login
          - /api/users/signin
          - /api/user/signin
          - /users/loginpost
        body:
          userName|email|name: probe.user@example.com
          password: "Probe9!Alpha"  # pragma: allowlist secret
        expected_status: 200
        allowed_statuses: [200, 201]
        expect_json: object
        expect_values: ["{user_id}"]

  - id: hw01-login-wrong
    kind: http
    title: Login with a wrong password does not succeed
    severity: minor
    allowed_alternatives:
      - The requirement is 204; 401, 404 and 400 are accepted as "did not succeed" but are marked by hw01-login-wrong-204
    probes:
      - method: POST
        path: /api/users/login
        path_alternatives:
          - /api/user/login
          - /users/login
          - /user/login
          - /api/login/login
          - /api/users/signin
          - /api/user/signin
          - /users/loginpost
        body:
          userName|email|name: probe.user@example.com
          password: "999999"
        expected_status: 204
        allowed_statuses: [204, 401, 404, 400]

  - id: hw01-login-wrong-204
    kind: http
    title: Login with a wrong password returns 204, as the assignment requires
    severity: minor
    probes:
      - method: POST
        path: /api/users/login
        path_alternatives:
          - /api/user/login
          - /users/login
          - /user/login
          - /api/login/login
          - /api/users/signin
          - /api/user/signin
          - /users/loginpost
        body:
          userName|email|name: probe.user@example.com
          password: "999999"
        expected_status: 204

  - id: hw01-update
    kind: http
    title: PUT updates a user
    severity: major
    depends_on: [hw01-create]  # updates the user the POST probe created
    allowed_alternatives:
      - The assignment asks PUT to return Ok() (200); 204 is also accepted
    probes:
      - method: PUT
        path: "/api/users/{user_id}"
        path_alternatives: ["/api/user/{user_id}", "/users/{user_id}", "/user/{user_id}", "/api/login/{user_id}"]
        body:
          id: "{user_id}"
          userName|email|name: probe.updated@example.com
          password: "Probe9!Alpha"  # pragma: allowlist secret
        expected_status: 200
        allowed_statuses: [200, 204]

  - id: hw01-update-read-back
    kind: http
    title: After PUT, the user is read back by the same id with the new details
    severity: major
    depends_on: [hw01-update, hw01-read-back]  # needs the update, and GET by id to read it
    probes:
      - method: GET
        path: "/api/users/{user_id}"
        path_alternatives: ["/api/user/{user_id}", "/users/{user_id}", "/user/{user_id}", "/api/login/{user_id}"]
        expected_status: 200
        expect_json: object
        expect_values: ["probe.updated@example.com", "{user_id}"]

  # Stage 17, approved by the developer on 2026-11-05: the client files in wwwroot.
  # A finding means the page really breaks; what cannot be told from the files is skipped.
  - id: hw01-client-pages
    kind: structure
    title: wwwroot has an HTML page
    severity: major
    check: file_exists
    params:
      glob: "**/wwwroot/**/*.html"

  - id: hw01-client-scripts
    kind: structure
    title: wwwroot has a JavaScript file
    severity: major
    check: file_exists
    params:
      glob: "**/wwwroot/**/*.js"

  - id: hw01-client-file-refs
    kind: custom
    title: Every script, stylesheet and image a page refers to exists, with the same letter case
    severity: major
    check: client_file_refs
    params:
      root: wwwroot

  - id: hw01-client-element-ids
    kind: custom
    title: Every element id a script looks up exists in a page that loads the script
    severity: major
    check: client_element_ids
    params:
      root: wwwroot

  - id: hw01-client-fetch-routes
    kind: custom
    title: Every fetch URL in the scripts matches a route the API declares
    severity: major
    check: client_fetch_routes
    params:
      root: wwwroot
