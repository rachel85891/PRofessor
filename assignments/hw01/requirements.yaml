# Assignment 1: users API with text-file storage.
# Approved by the developer on 2026-10-25 as a starting point; to be finalized with the lecturer.
# taught_techniques: to be filled from the course slides.
id: hw01
order: 1
title: Users API with text-file storage
requirements:
  - id: hw01-list
    kind: http
    title: GET returns the list of users
    severity: major
    probes:
      - method: GET
        path: /api/users
        path_alternatives: [/api/user, /users, /user, /api/login]
        expected_status: 200

  - id: hw01-get-missing
    kind: http
    title: GET by id of a user that does not exist does not return 200
    severity: major
    allowed_alternatives:
      - Returning 204 NoContent is acceptable
    probes:
      - method: GET
        path: /api/users/99999
        path_alternatives: [/api/user/99999, /users/99999, /user/99999, /api/login/99999]
        expected_status: 404
        allowed_statuses: [404, 204]

  - id: hw01-create
    kind: http
    title: POST creates a user
    severity: critical
    allowed_alternatives:
      - Returning 200 instead of 201 is acceptable
    probes:
      - method: POST
        path: /api/users
        path_alternatives:
          - /api/user
          - /users
          - /user
          - /api/login
          - /api/users/register
          - /api/users/signup
          - /users/loguppost
          - /api/users/signin
          - /api/user/signin
        body:
          userName|email|name: probe.user@example.com
          password: "123456"
        expected_status: 201
        allowed_statuses: [201, 200]
        capture:
          name: user_id
          from: body:id

  - id: hw01-read-back
    kind: http
    title: The created user can be read back by id (the data is saved)
    severity: critical
    probes:
      - method: GET
        path: "/api/users/{user_id}"
        path_alternatives: ["/api/user/{user_id}", "/users/{user_id}", "/user/{user_id}", "/api/login/{user_id}"]
        expected_status: 200

  - id: hw01-login
    kind: http
    title: Login with correct details succeeds
    severity: major
    allowed_alternatives:
      - Returning 201 is acceptable
    probes:
      - method: POST
        path: /api/users/login
        path_alternatives:
          - /api/user/login
          - /users/login
          - /user/login
          - /api/login/login
          - /api/users/signin
          - /api/user/signin
          - /users/loginpost
        body:
          userName|email|name: probe.user@example.com
          password: "123456"
        expected_status: 200
        allowed_statuses: [200, 201]

  - id: hw01-login-wrong
    kind: http
    title: Login with a wrong password does not succeed
    severity: minor
    allowed_alternatives:
      - 401, 404 and 400 are all acceptable
    probes:
      - method: POST
        path: /api/users/login
        path_alternatives:
          - /api/user/login
          - /users/login
          - /user/login
          - /api/login/login
          - /api/users/signin
          - /api/user/signin
          - /users/loginpost
        body:
          userName|email|name: probe.user@example.com
          password: "999999"
        expected_status: 401
        allowed_statuses: [401, 404, 400]

  - id: hw01-update
    kind: http
    title: PUT updates a user
    severity: minor
    allowed_alternatives:
      - Returning 200 instead of 204 is acceptable
    probes:
      - method: PUT
        path: "/api/users/{user_id}"
        path_alternatives: ["/api/user/{user_id}", "/users/{user_id}", "/user/{user_id}", "/api/login/{user_id}"]
        body:
          id: "{user_id}"
          userName|email|name: probe.updated@example.com
          password: "123456"
        expected_status: 204
        allowed_statuses: [204, 200]

  - id: hw01-delete
    kind: http
    title: DELETE removes a user
    severity: minor
    allowed_alternatives:
      - Returning 200 instead of 204 is acceptable
      - After deleting, 404 or 204 for the same id is acceptable
    probes:
      - method: DELETE
        path: "/api/users/{user_id}"
        path_alternatives: ["/api/user/{user_id}", "/users/{user_id}", "/user/{user_id}", "/api/login/{user_id}"]
        expected_status: 204
        allowed_statuses: [204, 200]
      - method: GET
        path: "/api/users/{user_id}"
        path_alternatives: ["/api/user/{user_id}", "/users/{user_id}", "/user/{user_id}", "/api/login/{user_id}"]
        expected_status: 404
        allowed_statuses: [404, 204]
