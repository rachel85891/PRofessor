# yaml-language-server: $schema=../../course/schemas/review_rules.schema.json
# hw01's own review rules: the lecturer's decisions for this assignment (2026-10-28).
# They follow the course's rules (course/review_rules.yaml) and apply to later
# assignments too, unless a rule there replaces them or `until` ends them.
# Stage 3f moved these from the fixer's prompts and from services/fix_review.py and
# services/fix_edits.py; hw01's prompts must not change by one byte.
rules:
  - id: no-file-exists
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: never_do
    text: >-
      Never add `File.Exists` checks returning `BadRequest`, and do not comment on them: the
      path is not user input.
    after: no-core
    forbidden_text:
      - text: File.Exists
        message: added text must never use File.Exists
      - text: BadRequest(
        new_only: true
        message: added text must never return a new BadRequest(
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 4 (the lecturer, 2026-10-28)"
    status: approved

  - id: put-returns-ok
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: note_only
    text: >-
      PUT returns `Ok()`: the assignment asks for it. If PUT is `void`, add a note for the
      student (`//The assignment asks PUT to return Ok(): change void to IActionResult and
      return Ok() at the end`); do not change it.
    after: no-file-exists
    approved_notes:
      - words: The assignment asks PUT to return Ok()
        what: the PUT note in the approved wording
    never_a_violation: >-
      The PUT note in the approved wording (`//The assignment asks PUT to return Ok():
      change void to IActionResult and return Ok() at the end`).
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 5 (the lecturer, 2026-10-28)"
    status: approved

  - id: not-yet-taught
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    kind: never_mention
    text: >-
      Do not mention GET all (not required in HW1), layers, or a `Models` folder (taught
      later).
    after: put-returns-ok
    origin:
      source: developer
      quote: "docs/fix-pr-workflow.md §3, rule 6 (the lecturer, 2026-10-28)"
    status: approved

  # Stage 18: the client files in wwwroot (hw01 client task, part C). Each rule is limited
  # to the client file types, so a prompt without them is unchanged.
  - id: client-reference-fix
    applies_to: [fixer, judge]
    kind: fix_allowed
    files: [.html, .js]
    text: >-
      In the client files, fix a `<script src>`, a `<link href>`, an element id, or the id a
      `getElementById` / `querySelector` looks up, only when a check's finding names it (for
      example `update.js` looks for `#firstname`, but `update.html` has the id `name`).
      Change only that reference.
    detectors: [client_reference]
    named_by: [hw01-client-file-refs, hw01-client-element-ids]
    never_a_violation: >-
      A file name or element id that a check's finding names, changed in one `<script src>`,
      `<link href>`, `id` or `getElementById` / `querySelector` and nothing else (rule
      {rule:client-reference-fix}).
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task)"
    status: approved

  - id: client-condition-fix
    applies_to: [fixer, judge]
    kind: fix_allowed
    files: [.html, .js]
    text: >-
      In the client files, fix `=` used instead of `===` inside an `if (…)` condition (`if
      (res.status = 200)`): change only that `=` to `===`, nothing else on the line.
    detectors: [assignment_in_condition]
    never_a_violation: >-
      An `=` changed to `===` inside an `if` condition, with nothing else on the line (rule
      {rule:client-condition-fix}).
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task)"
    status: approved

  - id: client-questions
    applies_to: [fixer, judge]
    kind: note_only
    files: [.html, .js]
    text: >-
      In the client files, ask or point out in a note (in the file's comment syntax), never
      change: an input element used instead of its `.value`; a variable that is never
      defined; `response.json()` or `.text()` not awaited; a `fetch` URL that does not match
      the API (when a check found it, for example after the controller was renamed: the
      `fetch` URLs have to change too); a misspelled or inconsistent file name (`Uptate.js`,
      `UserDetailes.html`), with "change the `<script src>` too".
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task)"
    status: approved

  - id: client-leftover-files
    applies_to: [fixer, judge]
    kind: note_only
    files: [.html, .js]
    text: >-
      An empty leftover client file (an empty `appSetting.js`) goes in `files_notes`: "delete
      it if it isn't needed".
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task)"
    status: approved

  - id: client-naming
    applies_to: [fixer, judge]
    kind: note_only
    files: [.js]
    note_section: names
    text: >-
      JavaScript names that are not camelCase get a naming note (`note_section`: `names`),
      never a change.
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task)"
    status: approved

  - id: client-never-mention
    applies_to: [fixer, judge]
    kind: never_mention
    files: [.html, .js]
    text: >-
      In the client files, never mention `onclick=` in HTML, `alert`, `console.log`, `var` or
      `let` style, formatting, frameworks or modules, or anything the course has not taught.
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task)"
    status: approved

  - id: client-css
    applies_to: [fixer, judge]
    kind: never_mention
    files: [.css]
    text: >-
      Never comment on CSS style. Mention CSS only when it really breaks the page, for
      example a rule that hides a form the page needs.
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task): CSS only when it really breaks the page"
    status: approved

examples:
  - id: get-by-id-put-break-newline
    # Moved from code in stage 3f.
    applies_to: [fixer, judge]
    situation: >-
      `Controllers/OrdersController.cs` has `GET api/orders/{id}` returning `null` for every
      id (not implemented), and `Put` declared `void`, whose loop keeps reading the file
      after it found the order. The data file `orders.txt` has no final newline.
    plan: |-
      {"edits": [
        {"file": "Controllers/OrdersController.cs",
         "find": "            return null;",
         "replace": "            //Why isn't it implemented? It should read the file and return the order with this id (or NotFound / NoContent)\n            return null;",
         "kind": "note", "finding_ids": ["hw09-get-by-id"],
         "reason": "GET by id is part of the assignment; the student should write it.", "fallback_note": null,
         "note_section": "for_you"},
        {"file": "Controllers/OrdersController.cs",
         "find": "        public void Put(int id, [FromBody] Order order)",
         "replace": "        //The assignment asks PUT to return Ok(): change void to IActionResult and return Ok() at the end\n        public void Put(int id, [FromBody] Order order)",
         "kind": "note", "finding_ids": [],
         "reason": "The assignment asks PUT to return Ok().", "fallback_note": null,
         "note_section": "for_you"},
        {"file": "Controllers/OrdersController.cs",
         "find": "                    if (order.Id == id)\n                        orderToReplace = currentOrderLine;",
         "replace": "                    if (order.Id == id)\n                    {\n                        orderToReplace = currentOrderLine;\n                        //fix: Found- break\n                        break;\n                    }",
         "kind": "fix", "finding_ids": [],
         "reason": "Once the order is found, the loop keeps reading the rest of the file.",
         "fallback_note": "Once the order is found, does the loop need to keep reading the file?",
         "note_section": null},
        {"file": "orders.txt", "find": "", "replace": "", "kind": "final_newline",
         "finding_ids": [], "reason": "The last line has no newline, so the next append joins it.",
         "fallback_note": null, "note_section": null}
       ],
       "files_notes": []}
    origin:
      source: developer
      quote: "the approved PRs, as invented repos"
    status: approved

  - id: client-id-condition-await
    # Stage 18 (hw01 client task): the approved PRs' client items, as an invented repo.
    applies_to: [fixer, judge]
    files: [.html, .js]
    situation: >-
      `wwwroot/update.js` looks up `#firstname`, but `wwwroot/update.html` has the id `name`
      (finding `hw01-client-element-ids`). The script also checks `if (res.status = 200)`,
      and reads the reply with `const user = res.json();`.
    plan: |-
      {"edits": [
        {"file": "wwwroot/update.html",
         "find": "    <input type=\"text\" id=\"name\">",
         "replace": "    <!--fix: update.js looks for the id firstname-->\n    <input type=\"text\" id=\"firstname\">",
         "kind": "fix", "finding_ids": ["hw01-client-element-ids"],
         "reason": "update.js looks up firstname, which no element of update.html has, so the lookup returns null.",
         "fallback_note": "update.js looks for the id firstname, but this input's id is name: which one is right?",
         "note_section": null},
        {"file": "wwwroot/update.js",
         "find": "    if (res.status = 200) {",
         "replace": "    //fix: = sets the status to 200; === compares it\n    if (res.status === 200) {",
         "kind": "fix", "finding_ids": [],
         "reason": "The condition sets the status to 200 instead of comparing it, so it is always true.",
         "fallback_note": "Should this be ===? = sets the status to 200, so the condition is always true.",
         "note_section": null},
        {"file": "wwwroot/update.js",
         "find": "        const user = res.json();",
         "replace": "        //res.json() returns a Promise: add await, otherwise user is the Promise and not the user\n        const user = res.json();",
         "kind": "note", "finding_ids": [],
         "reason": "res.json() is not awaited.", "fallback_note": null,
         "note_section": "for_you"}
       ],
       "files_notes": []}
    origin:
      source: developer
      quote: "developer decision 2026-11-05 (hw01 client task); the approved PRs, as an invented repo"
    status: approved
