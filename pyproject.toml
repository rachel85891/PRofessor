[project]
name = "hw-checker"
version = "0.1.0"
description = "LangGraph agent that checks homework for a .NET 9 Web API course."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker>=7.2.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hw_checker"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["hw_checker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The Docker SDK ships no type information; its untyped surface stays inside
# hw_checker.adapters.docker_runner.engine behind narrow typed wrappers.
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: touches Docker, real Git or a real LLM; run locally on demand",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.importlinter]
root_package = "hw_checker"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers depend inward only: ui -> graph -> services | checks | judge | reporting -> ports -> domain"
type = "layers"
containers = ["hw_checker"]
layers = [
    "ui",
    "graph",
    "services | checks | judge | reporting",
    "ports",
    "domain",
]

[[tool.importlinter.contracts]]
name = "graph uses only services and domain (no ports, checks, judge, reporting, adapters or bootstrap)"
type = "forbidden"
source_modules = ["hw_checker.graph"]
forbidden_modules = [
    "hw_checker.ports",
    "hw_checker.checks",
    "hw_checker.judge",
    "hw_checker.reporting",
    "hw_checker.adapters",
    "hw_checker.bootstrap",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services, checks, judge and reporting use only domain and ports (no graph, ui, adapters or bootstrap)"
type = "forbidden"
source_modules = [
    "hw_checker.services",
    "hw_checker.checks",
    "hw_checker.judge",
    "hw_checker.reporting",
]
forbidden_modules = [
    "hw_checker.graph",
    "hw_checker.ui",
    "hw_checker.adapters",
    "hw_checker.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Only bootstrap imports adapters"
type = "forbidden"
source_modules = [
    "hw_checker.domain",
    "hw_checker.ports",
    "hw_checker.services",
    "hw_checker.checks",
    "hw_checker.judge",
    "hw_checker.reporting",
    "hw_checker.graph",
    "hw_checker.config",
    "hw_checker.ui",
]
forbidden_modules = ["hw_checker.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain imports only stdlib and pydantic (no other layer, no config, no listed third-party library)"
type = "forbidden"
source_modules = ["hw_checker.domain"]
forbidden_modules = [
    "hw_checker.ports",
    "hw_checker.services",
    "hw_checker.checks",
    "hw_checker.judge",
    "hw_checker.reporting",
    "hw_checker.graph",
    "hw_checker.adapters",
    "hw_checker.config",
    "hw_checker.ui",
    "hw_checker.bootstrap",
    "pydantic_settings",
    "yaml",
    "langgraph",
    "langchain",
    "langchain_core",
    "sqlalchemy",
    "alembic",
    "docker",
    "github",
    "openpyxl",
    "jinja2",
    "streamlit",
]

[[tool.importlinter.contracts]]
name = "ui does not import graph, adapters or ports directly (it goes through bootstrap and services)"
type = "forbidden"
source_modules = ["hw_checker.ui"]
forbidden_modules = [
    "hw_checker.graph",
    "hw_checker.adapters",
    "hw_checker.ports",
]
allow_indirect_imports = true
