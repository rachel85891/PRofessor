[project]
name = "hw-checker"
version = "0.1.0"
description = "LangGraph agent that checks homework for a .NET 9 Web API course."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hw_checker"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["hw_checker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: touches Docker, real Git or a real LLM; run locally on demand",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
